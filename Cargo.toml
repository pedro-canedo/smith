[workspace]
resolver = "2"
members = [
    "crates/smith-core",
    "crates/smith-providers",
    "crates/smith-tools",
    "crates/smith-mcp",
    "crates/smith-persist",
    "crates/smith-tui",
    "crates/smith-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
smith-core = { path = "crates/smith-core" }
smith-providers = { path = "crates/smith-providers" }
smith-tools = { path = "crates/smith-tools" }
smith-mcp = { path = "crates/smith-mcp" }
smith-persist = { path = "crates/smith-persist" }
smith-tui = { path = "crates/smith-tui" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal", "io-util"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
# Fork of `tui-textarea` — the upstream crate is pinned to ratatui 0.29 and two
# ratatui majors can't share a `Frame`. This one also has the soft-wrap and
# `measure()`/`min_rows`/`max_rows` APIs the auto-growing input box needs.
tui-textarea = { package = "tui-textarea-2", version = "0.12", default-features = false, features = ["crossterm"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
async-stream = "0.3"

clap = { version = "4", features = ["derive"] }
toml = "0.8"
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
glob = "0.3"
dialoguer = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
