[workspace]
resolver = "2"
members = [
    "crates/smith-core",
    "crates/smith-provider",
    "crates/smith-tools",
    "crates/smith-mcp",
    "crates/smith-store",
    "crates/smith-config",
    "crates/smith-tui",
    "crates/smith-cli",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
# Minimum supported Rust version, verified empirically: `cargo check --workspace`
# passes on 1.88.0 and is refused on 1.87.0. The floor comes from the dependency
# graph (ratatui 0.30 and darling 0.24 both declare `rust-version = 1.88.0`),
# not from first-party syntax. CI enforces it in the `msrv` job; bump this only
# together with that job.
rust-version = "1.88"

# The gate lived only on CI's command line (`cargo clippy -- -D warnings`), so
# a local `cargo clippy` was quieter than CI and you found out at push time.
# Declaring it here means the manifest carries the rule and every invocation
# obeys it. The five pointwise `#[allow(clippy::too_many_arguments)]` still
# work — an allow on the item outranks a deny in the manifest.
#
# Deliberately not `pedantic` or `nursery`, and specifically not
# `too_many_lines` or `cognitive_complexity`: the first defaults to 100 lines
# and counts test functions under `--all-targets`, so turning it on means
# writing a dozen `#[allow]`s for functions that are long by design; the second
# is a nursery lint whose heuristic drifts between toolchains, which in a repo
# with a pinned MSRV job means a Rust upgrade can redden CI for no change.
# File size is measured instead, honestly, by `scripts/check-file-size.sh`.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# A debug print that reached main is a mistake, not a style choice. Note this
# is a CLI whose job is printing, so `print_stdout`/`print_stderr` stay off.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
smith-core = { path = "crates/smith-core" }
smith-provider = { path = "crates/smith-provider" }
smith-tools = { path = "crates/smith-tools" }
smith-mcp = { path = "crates/smith-mcp" }
smith-store = { path = "crates/smith-store" }
smith-config = { path = "crates/smith-config" }
smith-tui = { path = "crates/smith-tui" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal", "io-util"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
# Fork of `tui-textarea` — the upstream crate is pinned to ratatui 0.29 and two
# ratatui majors can't share a `Frame`. This one also has the soft-wrap and
# `measure()`/`min_rows`/`max_rows` APIs the auto-growing input box needs.
tui-textarea = { package = "tui-textarea-2", version = "0.12", default-features = false, features = ["crossterm"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
async-stream = "0.3"

clap = { version = "4", features = ["derive"] }
toml = "0.8"
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
# ripgrep's own guts, used directly rather than shelling out to `rg`: no
# external binary to install, and `.gitignore`/type filtering comes for free.
ignore = "0.4"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
dialoguer = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
