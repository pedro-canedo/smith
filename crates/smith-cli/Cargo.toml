[package]
name = "smith-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "smith"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
# Restoring the default SIGPIPE disposition so piping into `head` exits
# quietly instead of panicking. Already in the tree via tokio.
libc = "0.2"

[dependencies]
smith-core = { workspace = true }
smith-provider = { workspace = true }
smith-tools = { workspace = true }
smith-mcp = { workspace = true }
smith-store = { workspace = true }
smith-config = { workspace = true }
smith-tui = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
color-eyre = "0.6"
clap = { workspace = true }
dialoguer = { workspace = true }
reqwest = { workspace = true }
directories = { workspace = true }
sysinfo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# Chrome for Testing ships every platform as a zip; `deflate` is the only
# compression method those archives actually use, so the rest stays out.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Chrome for Testing publishes no checksums of its own, but Google Cloud
# Storage serves an MD5 of the stored object. See `runtime.rs` for what that
# is and isn't worth.
md-5 = "0.11"
base64 = "0.23"

[dev-dependencies]
# `testkit` brings in `ScriptedProvider`, so the orchestrator/headless tests
# drive real turns without a network. Resolver 2 keeps the feature out of the
# normal build of the dependency above.
smith-core = { workspace = true, features = ["testkit"] }
tempfile = "3"
# Doctor's tests build `Config` values from literal TOML, which is how a user's
# file actually reaches it. Test-only: nothing in the binary parses TOML —
# `smith-config` owns the format.
toml = { workspace = true }
