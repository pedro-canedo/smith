<!doctype html>
<!-- Placeholder shell: replaced by the built web/ app in a later phase.
     Proves the whole wire — snapshot, SSE stream, actions, approvals —
     with nothing but inline script, so the server is testable end to end
     before the real frontend exists. Palette: docs/design-system.md. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smith console</title>
<style>
  :root {
    --base: #101215; --raised: #16181C; --overlay: #1E2126;
    --text: #E2E5E9; --secondary: #949AA3; --disabled: #727882;
    --ember: #FF8C3C; --amber: #FFBE5A; --success: #58CE80;
    --danger: #F36666; --warning: #FACC15; --info: #56B6FF;
  }
  body { background: var(--base); color: var(--text); font: 14px/1.5 ui-monospace, monospace; margin: 0; }
  main { max-width: 100ch; margin: 0 auto; padding: 1rem; }
  h1 { color: var(--ember); font-size: 1.1rem; }
  #phase { color: var(--secondary); }
  #log { background: var(--raised); border-radius: 8px; padding: .75rem 1rem; min-height: 40vh;
         white-space: pre-wrap; overflow-wrap: anywhere; }
  #ask { background: var(--overlay); border: 1px solid var(--warning); border-radius: 8px;
         padding: .75rem 1rem; margin: .75rem 0; display: none; }
  #ask button { margin-right: .5rem; }
  form { display: flex; gap: .5rem; margin-top: .75rem; }
  input[type=text] { flex: 1; background: var(--overlay); color: var(--text);
                     border: 1px solid var(--disabled); border-radius: 6px; padding: .5rem; }
  button { background: var(--overlay); color: var(--ember); border: 1px solid var(--ember);
           border-radius: 6px; padding: .5rem .75rem; cursor: pointer; }
  .sys { color: var(--disabled); }
</style>
<main>
  <h1>smith console <span id="phase">connecting…</span></h1>
  <div id="ask"></div>
  <div id="log"></div>
  <form id="composer">
    <input type="text" id="prompt" placeholder="Ask anything…" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</main>
<script>
  const token = new URLSearchParams(location.search).get("t");
  const api = (path, body) => fetch(path, {
    method: body ? "POST" : "GET",
    headers: body
      ? { "X-Smith-Token": token, "Content-Type": "application/json" }
      : { "X-Smith-Token": token },
    body: body ? JSON.stringify(body) : undefined,
  });
  const log = document.getElementById("log");
  const phase = document.getElementById("phase");
  const ask = document.getElementById("ask");
  let seq = 0;
  let busy = false;

  function line(text, cls) {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function showAsk(state) {
    const p = state.pending_permission, q = state.pending_question;
    ask.style.display = (p || q) ? "block" : "none";
    ask.textContent = "";
    if (p) {
      line(`permission requested: ${p.tool_name} — ${p.detail}`, "sys");
      ask.append(`${p.tool_name}: ${p.detail} — `);
      for (const [label, decision] of [["allow once", "allow_once"],
                                       ["allow session (authorizes every future " + p.tool_name + " this session)", "allow_session"],
                                       ["deny", "deny"]]) {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = () => api("/api/ask/answer",
          { kind: "permission", tool_call_id: p.tool_call_id, decision });
        ask.append(b);
      }
    } else if (q) {
      ask.append(q.prompt + " ");
      q.options.forEach((option) => {
        const b = document.createElement("button");
        b.textContent = option;
        b.onclick = () => api("/api/ask/answer", { kind: "question", id: q.id, answer: option });
        ask.append(b);
      });
    }
  }

  async function snapshot() {
    const state = await (await api("/api/state")).json();
    seq = state.seq;
    busy = state.phase !== "idle";
    phase.textContent = `· ${state.provider} · ${state.model} · ${state.phase}`;
    log.textContent = "";
    for (const item of state.transcript) {
      if (item.kind === "user") line("you: " + item.text);
      else if (item.kind === "assistant") line(item.text);
      else if (item.kind === "system") line(item.text, "sys");
      else if (item.kind === "tool_card")
        line(`[${item.tool_name}] ${item.running ? "running" : item.is_error ? "error" : "done"}`, "sys");
    }
    if (state.streaming_text) line(state.streaming_text);
    showAsk(state);
  }

  const events = new EventSource(`/api/events?t=${encodeURIComponent(token)}`);
  events.onopen = snapshot;
  events.onmessage = (message) => {
    const event = JSON.parse(message.data);
    if (event.type === "gap") { snapshot(); return; }
    if (event.type === "hello") return;
    if (message.lastEventId && Number(message.lastEventId) <= seq) return;
    // The placeholder resnapshots on everything meaningful; the real app
    // applies events incrementally.
    snapshot();
  };
  events.onerror = () => { phase.textContent = "· session ended (retrying…)"; };

  document.getElementById("composer").onsubmit = (submit) => {
    submit.preventDefault();
    const input = document.getElementById("prompt");
    const text = input.value.trim();
    if (!text) return;
    api("/api/action", busy ? { type: "interject", data: text }
                            : { type: "submit_message", data: text });
    input.value = "";
  };
</script>
</html>
