[package]
name = "smith-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
smith-core = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
async-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The fallback chain's tests script both rungs with `ScriptedProvider`.
smith-core = { workspace = true, features = ["testkit"] }
# The live `/api/show` probe test needs a runtime; nothing in the shipped
# crate does, which is why this is dev-only.
tokio = { workspace = true, features = ["macros", "rt"] }
