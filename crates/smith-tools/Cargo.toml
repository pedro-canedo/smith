[package]
name = "smith-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
smith-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Content addressing for turn checkpoints. Both are already in the dependency
# graph via reqwest's TLS stack, so neither adds a compilation unit.
sha2 = "0.10"
hex = "0.4"
tokio = { workspace = true }
tokio-util = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
grep-matcher = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
similar = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
url = "2"

# `killpg` for cancelling a whole shell process group; already in the tree via
# tokio, so it costs no extra compilation.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
