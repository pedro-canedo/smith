name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: smith

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            targets: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - name: linux-aarch64
            targets: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            linker: aarch64-linux-gnu-gcc
          # Both Apple artifacts come off one Arm runner. An Arm Mac carries the
          # x86_64 slice of the Apple SDK, so the Intel target cross-compiles
          # here for free — and macOS runners are the scarcest label in the
          # hosted pool, where a second job is not a second machine but a second
          # place in a queue that has cost this release 50 minutes before.
          - name: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            os: macos-14
          - name: windows-x86_64
            targets: x86_64-pc-windows-msvc
            os: windows-latest

    env:
      TARGETS: ${{ matrix.targets }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # `v0.1.0` -> `0.1.0`, from the pushed tag or the manual input.
      - name: Resolve version
        shell: bash
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "VERSION=${RAW_TAG#v}" >> "$GITHUB_ENV"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # `rusqlite` is built with the `bundled` feature, so cross-compiling to
      # aarch64 needs a cross C toolchain as well as the Rust target.
      - name: Install aarch64 cross toolchain
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # A matrix entry may carry more than one target (the Apple pair). The
      # artifact name still comes from the triple, so a two-target runner emits
      # exactly the tarballs a one-target runner did.
      - name: Build
        shell: bash
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked -p smith-cli --target "$target"
          done

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for target in ${TARGETS//,/ }; do
            STAGE="$BIN_NAME-$VERSION-$target"
            mkdir -p "dist/$STAGE"
            cp "target/$target/release/$BIN_NAME" "dist/$STAGE/"
            cp README.md LICENSE "dist/$STAGE/"
            tar -C dist -czf "dist/$STAGE.tar.gz" "$STAGE"
            (cd dist && shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256")
          done

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for target in ${TARGETS//,/ }; do
            STAGE="$BIN_NAME-$VERSION-$target"
            mkdir -p "dist/$STAGE"
            cp "target/$target/release/$BIN_NAME.exe" "dist/$STAGE/"
            cp README.md LICENSE "dist/$STAGE/"
            (cd dist && 7z a "$STAGE.zip" "$STAGE" >/dev/null)
            (cd dist && certutil -hashfile "$STAGE.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$STAGE.zip.sha256")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              dist/*
          fi
