name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The only job that needs a matrix: crossterm is the terminal backend and the
  # shell tool's process-group kill is `cfg(unix)`, so the platform-divergent
  # code lives here. `fail-fast: false` keeps one red platform from hiding the
  # state of the other two.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

  # fmt and clippy are platform-independent for this codebase, so running them
  # on all three platforms would just burn CI minutes on identical output.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Guards `rust-version` in the root Cargo.toml. Keep the pin below in sync
  # with `[workspace.package] rust-version`.
  msrv:
    name: msrv (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2

      # `rust-toolchain.toml` pins `stable` and outranks `rustup default`, so
      # the toolchain has to be selected explicitly with `+1.88.0` — otherwise
      # this job would silently check with stable instead of the MSRV.
      - name: cargo check
        run: cargo +1.88.0 check --workspace --all-targets
